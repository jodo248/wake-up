name: Wake Up

on:
  repository_dispatch:
    types: [cronjob-failed]
  workflow_dispatch:

jobs:
  wake-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Wake Render service (hold connection open until HTTP 200)
        id: wake
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          echo "Connecting to: $RENDER_URL"
          echo "Holding connection open — Render will respond once the container is ready (max. 240 seconds)..."

          START=$(date +%s)

          # Single persistent request; Render holds it open while spinning up,
          # then responds with 200 once your app is listening — just like a browser.
          HTTP_STATUS=$(curl -o /tmp/render_response.html -s -w "%{http_code}" \
            --max-time 240 \
            "$RENDER_URL" || echo "000")

          END=$(date +%s)
          ELAPSED=$(( END - START ))

          echo "HTTP status: $HTTP_STATUS  (after ${ELAPSED}s)"

          CONTENT_MATCH=false
          if [ "$HTTP_STATUS" = "200" ]; then
            # Check response body for expected page markers (any one match is enough).
            # Markers: Unsplash image URL · black background · aspect-ratio · hero class ·
            #          object-fit: cover · specific photo ID
            if grep -qE \
              'unsplash\.com|#000000|1920[[:space:]]*/[[:space:]]*1080|class="hero"|object-fit:[[:space:]]*cover|photo-1506905925346' \
              /tmp/render_response.html 2>/dev/null; then
              CONTENT_MATCH=true
              echo "Content check: ✅ PASSED — expected page markers found"
            else
              echo "Content check: ⛔ FAILED — no expected markers found in response body"
              echo "--- Response body (first 40 lines) ---"
              head -40 /tmp/render_response.html || true
            fi
          fi

          if [ "$HTTP_STATUS" = "200" ] && [ "$CONTENT_MATCH" = "true" ]; then
            SUCCESS=true
          else
            SUCCESS=false
          fi

          echo "success=$SUCCESS"             >> "$GITHUB_OUTPUT"
          echo "elapsed=$ELAPSED"             >> "$GITHUB_OUTPUT"
          echo "http_status=$HTTP_STATUS"     >> "$GITHUB_OUTPUT"
          echo "content_match=$CONTENT_MATCH" >> "$GITHUB_OUTPUT"

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          SUCCESS="${{ steps.wake.outputs.success }}"
          ELAPSED="${{ steps.wake.outputs.elapsed }}"
          HTTP_STATUS="${{ steps.wake.outputs.http_status }}"
          CONTENT_MATCH="${{ steps.wake.outputs.content_match }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$SUCCESS" = "true" ]; then
            COLOR=3066993   # green
            TITLE="✅ Render is back online"
            DESCRIPTION="**$RENDER_URL** Woke up after ${ELAPSED} seconds (HTTP $HTTP_STATUS)."
          elif [ "$HTTP_STATUS" = "200" ] && [ "$CONTENT_MATCH" = "false" ]; then
            COLOR=16776960  # yellow
            TITLE="⚠️ HTML mismatch"
            DESCRIPTION="**$RENDER_URL** Woke up after ${ELAPSED} seconds but wrong HTML (HTTP $HTTP_STATUS)."
          else
            COLOR=15158332  # red
            TITLE="⛔ Failed to wake Render"
            DESCRIPTION="**$RENDER_URL** Timed out after ${ELAPSED} seconds (HTTP $HTTP_STATUS)."
          fi

          PAYLOAD=$(printf '{
            "embeds": [{
              "title": "%s",
              "description": "%s",
              "color": %s,
              "fields": [
                {"name": "Triggered by", "value": "Cron-Job.org", "inline": true},
                {"name": "Workflow run", "value": "[View logs](%s)", "inline": true}
              ],
              "footer": {"text": "Wake-Up · GitHub Actions"}
            }]
          }' "$TITLE" "$DESCRIPTION" "$COLOR" "$RUN_URL")

          HTTP_RESP=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK")

          echo "Discord webhook response: $HTTP_RESP"

          if [ "$HTTP_RESP" != "204" ]; then
            echo "Warning: Discord webhook returned $HTTP_RESP (expected 204)"
          fi
